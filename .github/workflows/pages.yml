# Veroeffentlicht den Ordner app/ bei jedem Push auf main als GitHub Pages
name: Webseite veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Offline-Speicher bekommt pro Veroeffentlichung eine neue Version (siehe app/sw.js)
      - name: Version in den Service Worker schreiben
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" app/sw.js && grep -n "const VERSION" app/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # GitHub findet das eben hochgeladene Paket manchmal nicht sofort ("No artifacts named github-pages").
      # Dann nach kurzer Pause ein zweiter Versuch, statt dass die Seite alt bleibt.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Kurz warten vor zweitem Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # Suchmaschinen (Bing, Yandex, Seznam, Naver ...) sofort ueber neue Inhalte informieren.
      # Bing ist wichtig, weil ChatGPT und Copilot darueber suchen. Google nutzt IndexNow nicht.
      # Der Schluessel liegt oeffentlich unter app/e49bb67e7c1d01f2845bb7a521891f06.txt, das ist so vorgesehen.
      - name: IndexNow melden
        continue-on-error: true
        run: |
          sleep 20
          curl -s -o /dev/null -w 'IndexNow: %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"bitweg.de","key":"e49bb67e7c1d01f2845bb7a521891f06","keyLocation":"https://bitweg.de/e49bb67e7c1d01f2845bb7a521891f06.txt","urlList":["https://bitweg.de/","https://bitweg.de/ueber.html","https://bitweg.de/impressum.html","https://bitweg.de/datenschutz.html","https://bitweg.de/llms.txt"]}'
